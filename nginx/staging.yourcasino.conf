server {
    server_name staging.yourcasino.com;

    root /var/www/yourcasino/front-end/dist;
    index index.html;

    location / {
      auth_basic "Restricted Area";
      auth_basic_user_file /etc/nginx/.htpasswd;

      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- BACKEND (API) ----
    # Proxies /api/v1/... to backend. No trailing slash on proxy_pass => path preserved.
    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Forward Authorization headers (JWT/Bearer/etc.)
        proxy_set_header Authorization $http_authorization;

        # If your API streams responses, you might want:
        # proxy_buffering off;

        # Prevent indexing
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ---- BACKEND (WebSocket) ----
    # Proxies /socket (or adjust to your WS path, e.g. /ws, /socket.io/)
    location ^~ /socket.io/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Required for WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Helpful timeouts for WS
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;

        # Prevent indexing
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/staging.yourcasino.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/staging.yourcasino.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = yourcasino.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name yourcasino.com;
    listen 80;
    return 404; # managed by Certbot
}